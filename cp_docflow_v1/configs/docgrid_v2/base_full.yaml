# Shared DocGrid-Flow v2 architecture. Stage 2-5 configs inherit this file so
# checkpoint topology cannot drift silently between stages.
seed: 1337

data:
  train_manifest: ${DOCGRID_TRAIN_MANIFEST:-data/train_docgrid_v2.jsonl}
  val_manifest: ${DOCGRID_VAL_MANIFEST:-data/val_docgrid_v2.jsonl}
  input_work_size: [512, 512]
  output_work_size: [512, 512]
  frozen_contract: ${DOCGRID_FROZEN_CONTRACT:-runs/docgrid_v2/stage0_audit/frozen_contract.json}
  allowed_label_provenance: [analytic_gt, renderer_gt]

model:
  coarse:
    base_channels: 32
    feature_channels: 128
    max_displacement_ratio: 0.45
    min_log_variance: -6.0
    max_log_variance: 6.0
  qwen_backend: qwen
  qwen:
    model_id: ${DOCGRID_QWEN_MODEL:-/juicefs-algorithm/data/IPT/yuang_feng/DiffSynth-Studio/models/Qwen-Image-Edit}
    prompt: >-
      Rectify document geometry into a flat front-facing rectangle. Preserve
      every character, table line, illustration, margin, color, and texture.
      Do not add, remove, rewrite, translate, or restyle content.
    feature_num_inference_steps: 1
    feature_type: hidden
    feature_layers: [-24, -12, -1]
    hidden_channels: 3072
    feature_dtype: bfloat16
    feature_quantization: none
    feature_seed: 0
    guidance_scale: 1.0
    local_files_only: true
    cpu_offload: true
    device_map: null
  qwen_feature_channels: 96
  # Stage 4/5 opt in; keep deterministic Stage 1-3 checkpoints free of the
  # untrained Qwen adapter state.
  instantiate_qwen_adapter: false
  fusion_channels: 128
  fusion_mode: gated
  hv_channels: 32
  enable_hv_condition: true
  use_qwen_condition: true
  velocity_hidden_channels: 256
  velocity_time_channels: 256
  flow_blocks: 8
  flow_heads: 8
  flow_window_size: 8
  flow_global_pool_size: 8
  max_velocity_px: 64.0
  minimum_residual_gate: 0.25
  residual_clip_px: 64.0
  sigma_min: 0.0
  sigma_max: 4.0
  composition_uses_confidence: true
  detach_confidence_for_flow: true
  fm_steps: 4
  enable_flow_matching: true
  enable_refiner: true
  refiner_hidden_channels: 128
  refiner_iterations: 4
  refiner_max_step_px: 2.0
  convex_hidden_channels: 128
  upsampling_mode: convex
  inference_seed: 0

loss:
  velocity: 1.0
  residual_endpoint: 0.5
  map: 1.0
  coarse_map: 0.25
  sequence: 0.5
  confidence: 0.10
  warp: 0.10
  ssim: 0.05
  gradient: 0.05
  hv: 0.20
  straightness: 0.10
  bending: 0.02
  anti_fold: 0.05
  jacobian_scale: 0.05
  preserve: 0.20

train:
  device: cuda
  epochs: 20
  batch_size: 1
  eval_batch_size: 1
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  sequence_gamma: 0.8
  mixed_precision: true
  enforce_stage_gates: true
