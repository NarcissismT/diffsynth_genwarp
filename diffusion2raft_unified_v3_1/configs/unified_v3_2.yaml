# Production v3.2 continuation: arbitrary page orientation + conservative
# Qwen matching.  This config migrates a completed v3.1 unified checkpoint;
# the new global pose head is identity initialized and its Adam state starts
# fresh, while all existing learned weights are retained.
seed: 42
device: cuda
data:
  train_manifest: data/train.jsonl
  val_manifest: data/val.jsonl
  work_size:
  - 512
  - 512
  batch_size: 1
  num_workers: 4
  guide_artifact_prob: 0.65
  guide_dropout_prob: 0.1
  # Source-only transform. The target stays canonical and the loader composes
  # H into the absolute backward coordinate map before rebuilding flow/valid.
  source_geometry_augment:
    probability: 0.70
    max_rotation_deg: 180.0
    scale:
    - 0.85
    - 1.05
    translation:
    - 0.04
    - 0.04
    perspective: 0.025
model:
  feature_backend: qwen
  feature_channels: 96
  feature_stride: 8
  cnn_feature_channels: 64
  refiner_hidden_channels: 128
  refiner_iterations: 6
  correlation_radius: 4
  correlation_temperature: 1.0
  correlation_temperature_start: 9.797959
  correlation_ramp_start_epoch: 9
  correlation_ramp_epochs: 3
  match_temperature: 0.1
  shared_qwen_projection: false
  feature_dropout_prob: 0.1

  # Qwen's epoch-10 local match is mostly unreliable (raw gate 0.203 vs oracle
  # 0.036). Keep its helpful semantic context, but cap its cost-volume weight.
  match_confidence_power: 2.0
  match_confidence_cap: 0.05
  context_confidence_floor: 0.0
  detach_confidence_from_refiner: true

  prior_base_channels: 32
  prior_max_displacement_ratio: 0.35
  prior_control_stride: 8
  # The local head above cannot express a half-turn because each component is
  # capped at 35% of the canvas. This branch composes a global homography after
  # the local backward map and covers the full +/-180 degree distribution.
  prior_global_pose_enabled: true
  prior_global_pose_hidden_channels: 256
  prior_global_pose_pool_size: 4
  # Direct residual homography. A limit >2 makes -I (a 180-degree turn)
  # reachable at finite logits and supplies a non-zero first-order gradient.
  prior_global_pose_max_linear_delta: 2.50
  prior_global_pose_max_translation_ratio: 0.50
  prior_global_pose_max_perspective: 0.15
  max_residual_px: 24.0
train:
  stage: unified
  # Total epoch index. A normal launch starts from the completed v3.1 epoch 20
  # and adds twelve v3.2 epochs (roughly 1.4M augmented training samples).
  epochs: 32
  lr_prior: 0.0002
  lr_prior_joint: 1.0e-05
  lr_global_pose: 0.0002
  lr_unified: 5.0e-05
  lr_raft: 2.0e-05
  # Keep the mature local curl prior frozen for the first four v3.2 epochs.
  # The separately grouped global pose head trains immediately.
  freeze_prior_epochs: 24
  weight_decay: 1.0e-05
  grad_clip: 1.0
  amp: true
  amp_dtype: bfloat16
  log_every: 20
  save_every: 1
  preview_every: 1
  output_dir: runs/d2r_v3_2
  best_metric: line_epe
  best_metric_mode: min
  resume: runs/d2r_v3_1/unified/latest.pt
loss:
  sequence_gamma: 0.8
  max_valid_flow: 1000.0
  flow: 1.0
  prior_flow: 0.5
  prior_flow_unified: 0.25
  reconstruction: 0.15
  gradient: 0.1
  structure_flow: 0.15
  line_reconstruction: 0.05
  flow_gradient: 0.05
  curvature: 0.02
  line_straightness: 0.10
  structure_edge_threshold: 0.08
  structure_edge_temperature: 0.04
  structure_line_kernel: 15
  structure_line_threshold: 0.20
  structure_line_temperature: 0.05
  bending: 0.002
  anti_fold: 0.2
  residual: 0.002
  residual_flow: 0.25
  qwen_match: 0.05
  confidence: 0.02
  residual_target_iterations: 6
  max_residual_target: 24.0
  max_residual_consistency: 1.0
  gate_temperature_px: 1.0
  min_jacobian: 0.05
qwen:
  model_id: /juicefs-algorithm/data/IPT/yuang_feng/DiffSynth-Studio/models/Qwen-Image-Edit
  prompt: Rectify the warped photographed document into a flat front-facing page on
    the same canvas. Preserve every character, line, illustration, and margin. Do
    not add, remove, rewrite, translate, sharpen, or restyle any content. Change geometry
    only.
  feature_num_inference_steps: 4
  feature_type: hidden
  feature_layers:
  - -24
  - -12
  - -1
  feature_dtype: bfloat16
  feature_quantization: none
  quantize_components:
  - transformer
  feature_seed: 0
  guidance_scale: 1.0
  cpu_offload: false
  local_files_only: true
  device_map: null
  device_map_support_device: cuda:1
  device_map_max_memory_per_gpu: 20GiB
inference:
  resize_policy: letterbox
  padding_mode: replicate
